# LimaCharlie starter rules for an AI agent on your own computer
# ===============================================================
#
# A small set of Detection & Response (D&R) rules that watch what a local AI
# agent (Claude Code, Codex, OpenCode and similar) does on a computer you own,
# and raise an alert when it does something a security team would want to know
# about. They work on Linux, macOS and Windows.
#
# Push them into your organization with:
#
#   limacharlie sync push --config-file limacharlie-ai-agent.yaml --hive-dr-general
#
# (add --dry-run first to preview). Without --force this only adds or updates the
# rules named "agent-*" below; it never deletes anything else in your org.
#
# What these rules read
# ---------------------
#   * Linux, macOS and Windows sensors (process "rphcp", "rphcp.exe" on
#     Windows): NEW_PROCESS (every command that runs, with its full command
#     line) and DNS_REQUEST (every domain looked up).
#   * Chrome / Edge extension sensor: DNS_REQUEST (every new domain the browser
#     contacts) and HTTP_REQUEST (every request, with its URL and method).
#   * The platform's "enrollment" event (a new device joining the organization).
#
# How alerts work
# ---------------
# Every rule ends in a single "report" action. The report's `name` is the
# detection category (what you see in alerts and what routing keys on), its
# `priority` goes from 1 (FYI) to 5 (look right now), and `metadata` carries a
# plain-English explanation and a suggested next step. The rules only report.
# They never block, kill or isolate anything.
#
# Quiet by design
# ---------------
# AI agents legitimately run curl, git, npm, pip, "python -c", docker and
# headless browsers all day, so none of these rules fire on those by themselves.
# Each rule has `tests` (events that must match, and ordinary events that must
# not), which LimaCharlie runs every time the rule is saved. If a test fails the
# push is rejected.
#
# Windows and macOS notes
# -----------------------
# The `matches` operator ignores upper and lower case unless a rule says
# otherwise, which is what Windows command lines need ("Stop-Service" and
# "stop-service" are the same command). Paths are matched with either "/" or
# "\" so the same rule reads Linux, macOS and Windows command lines. The
# sensor's service is "limacharlie" on Linux, "com.refractionpoint.rphcp" on
# macOS and "rphcpsvc" on Windows.

version: 3
hives:
  dr-general:

    # ------------------------------------------------------------------
    # 1. Someone is trying to switch the security sensor off
    # ------------------------------------------------------------------
    agent-sensor-tamper:
      data:
        detect:
          event: NEW_PROCESS
          op: or
          rules:
            # A command line that mentions the sensor (the rphcp program,
            # the macOS service name, or the folders and identity files it
            # keeps) together with something that stops, deletes, replaces,
            # slows down or blocks it. Looking at the sensor (pgrep, ps,
            # launchctl list / print, sc query, Get-Service, systemctl status)
            # is not on the list, so checking that it is running is fine.
            - op: and
              rules:
                - op: matches
                  path: event/COMMAND_LINE
                  re: 'rphcp|com\.refractionpoint|(opt|etc|init\.d|Application\\? Support|ProgramData)[/\\]limacharlie([/\\]|["''\s;)]|$)|[/\\](etc|local|System32)[/\\]hcp(_conf|_hbs|_vdi)?($|[^A-Za-z0-9_-])'
                - op: or
                  rules:
                    - op: matches
                      path: event/COMMAND_LINE
                      re: '(^|[^A-Za-z0-9_.-])(kill|pkill|killall|taskkill|stop|stop-process|stop-service|suspend|pssuspend|suspend-process|delete|remove|remove-item|remove-service|uninstall|unload|bootout|disable|disabled|disable-service|mask|terminate|quit|rm|rmdir|rd|del|erase|unlink|mv|move|move-item|ren|rename|rename-item|cp|ln|truncate|shred|dd|chattr|chflags|strace|ltrace|gdb|lldb|dtruss|renice|ionice|cpulimit|takeown|block|drop|reject|deny)(\.exe)?($|[^A-Za-z0-9_.-])'
                    # sc.exe can also rewrite or lock down a service.
                    - op: matches
                      path: event/COMMAND_LINE
                      re: '(^|[^A-Za-z0-9_.-])sc(\.exe)?"?\s+(\\\\\S+\s+)?(config|failure|failureflag|sdset)\s'
                    # Firewall tools only count when they ADD, CHANGE or DELETE
                    # a rule or switch the firewall on or off. Listing the rules
                    # ("iptables -L", "nft list ruleset", "netsh ... show rule",
                    # "pfctl -sr") is just looking.
                    - &firewall_change
                      op: or
                      rules:
                        # iptables flags are case sensitive: -A -I -R -D change
                        # rules, while -d, -i and -L are not changes.
                        - op: matches
                          path: event/COMMAND_LINE
                          case sensitive: true
                          re: '(^|[^A-Za-z0-9_.-])ip6?tables(-legacy|-nft)?(\.exe)?\s+([^|;&]*\s)?(-[AIRD]|--append|--insert|--replace|--delete|-j\s+(DROP|REJECT))(\s|$)'
                        - op: matches
                          path: event/COMMAND_LINE
                          re: '(^|[^A-Za-z0-9_.-])ufw(\.exe)?\s+([^|;&]*\s)?(deny|reject|limit|insert|prepend|route|delete|reset)(\s|$)|(^|[^A-Za-z0-9_.-])nft(ables)?\s+([^|;&]*\s)?(add|insert|create|replace|delete|flush|-f)(\s|$)|(^|[^A-Za-z0-9_.-])pfctl\s+([^|;&]*\s)?-[A-Za-mo-rt-z]*[fFeEdDTt][A-Za-mo-rt-z]*(\s|$)|(^|[^A-Za-z0-9_.-])netsh(\.exe)?\s+([^|;&]*\s)?(add|set|delete)\s|(^|[^A-Za-z0-9_.-])(new|set)-netfirewallrule'
                    # chmod only counts when it takes away the right to run
                    # (chmod -x, chmod 644...). Making a file executable is fine.
                    - op: matches
                      path: event/COMMAND_LINE
                      re: '(^|[^A-Za-z0-9_.-])chmod\s+(-[A-Za-z]+\s+)*([ugoa]*-[rwxst]*x|[ugoa]*=[rw]*|0?[0246][0-7]{2})(\s|$)'
                # The sensor starting up is not tampering with it.
                - op: matches
                  path: event/FILE_PATH
                  re: '(^|[/\\])rphcp(\.exe)?$'
                  not: true
                # The installers' own commands are not tampering either, and
                # are matched as the WHOLE command line so nothing can be
                # tacked on to them. The Debian upgrade bridge copies the
                # sensor from /opt/limacharlie to /bin/rphcp; copying anything
                # else over the sensor still fires.
                - op: matches
                  path: event/COMMAND_LINE
                  re: '^\s*(/(usr/)?bin/)?cp\s+/opt/limacharlie/rphcp\s+/bin/rphcp\s*$'
                  not: true
                # The MSI sets the service to restart itself when it crashes
                # (sc failure ... actions= restart/...), and flags it. Only
                # recovery that RESTARTS the service is exempt. Removing the
                # recovery actions (actions= "") or any other sc change fires.
                - op: matches
                  path: event/COMMAND_LINE
                  re: '^\s*(cmd(\.exe)?"?\s+/c\s+)?(("?[A-Za-z]:\\windows\\system32\\)?sc(\.exe)?"?\s+failure\s+rphcpsvc\s+reset=\s*[0-9]+\s+actions=\s*restart/[0-9]+(/restart/[0-9]+)*(\s*&\s*("?[A-Za-z]:\\windows\\system32\\)?sc(\.exe)?"?\s+failureflag\s+rphcpsvc\s+1)?|("?[A-Za-z]:\\windows\\system32\\)?sc(\.exe)?"?\s+failureflag\s+rphcpsvc\s+1)\s*$'
                  not: true
            # Linux: the sensor's service is called "limacharlie".
            - op: and
              rules:
                - op: matches
                  path: event/COMMAND_LINE
                  re: '(^|[^A-Za-z0-9_.-])(systemctl|service|chkconfig|update-rc\.d|rc-service|rc-update|initctl)\s+([^|;&]*[\s/])?limacharlie(\.service)?($|[\s;|&"''])'
                - op: matches
                  path: event/COMMAND_LINE
                  re: '(^|[^A-Za-z0-9_.-])(stop|disable|mask|kill|remove|off|del|delete)($|[^A-Za-z0-9_.-])'
            # Linux: uninstalling the sensor package. (Restarting it, or
            # "pip uninstall limacharlie" for the command-line tool, is fine.)
            - op: matches
              path: event/COMMAND_LINE
              re: '(^|[^A-Za-z0-9_.-])(apt|apt-get|aptitude|dpkg|dnf|yum|zypper|rpm|apk)\s+([^|;&]*\s)?(remove|purge|erase|autoremove|--remove|--purge|-r|-P|-e|del)\s+([^|;&]*\s)?limacharlie($|[\s;|&"''])'
            # The sensor's own uninstall switches: rphcp -r (keep identity)
            # and rphcp -c (clean uninstall), on any platform.
            - op: matches
              path: event/COMMAND_LINE
              re: '(^|[/\\\s"''])rphcp(\.exe)?["'']?\s+(-[A-Za-z]+\s+)*-[rc]($|\s)'
            # Windows: uninstalling through Windows Installer or WMI.
            - op: matches
              path: event/COMMAND_LINE
              re: '(^|[^A-Za-z0-9_.-])msiexec(\.exe)?"?\s+(\S+\s+)*/(x|uninstall)\s.*(rphcp|hcp_win|limacharlie)'
            - op: and
              rules:
                - op: matches
                  path: event/COMMAND_LINE
                  re: '(win32_product|wmic\s+product|get-package|uninstall-package)'
                - op: matches
                  path: event/COMMAND_LINE
                  re: 'lima ?charlie|rphcp'
                - op: matches
                  path: event/COMMAND_LINE
                  re: '(^|[^A-Za-z0-9_.-])(uninstall|remove)($|[^A-Za-z0-9_.-])|\.uninstall\('
            # Cutting the sensor off from LimaCharlie: pointing its servers
            # at nowhere in the hosts file, or adding a firewall rule against
            # them (looking at the firewall rules is fine).
            - op: and
              rules:
                - op: matches
                  path: event/COMMAND_LINE
                  re: 'limacharlie\.io'
                - op: matches
                  path: event/COMMAND_LINE
                  re: '[/\\]etc[/\\]hosts'
                - op: matches
                  path: event/COMMAND_LINE
                  re: '>|(^|[^A-Za-z0-9_.-])(tee|add-content|set-content|out-file|cp|mv|copy)(\.exe)?($|[^A-Za-z0-9_.-])|sed\s+-[A-Za-z]*i'
            - op: and
              rules:
                - op: matches
                  path: event/COMMAND_LINE
                  re: 'limacharlie\.io'
                - *firewall_change
        respond:
          - action: report
            name: Security sensor tampering
            priority: 5
            suppression:
              # The shell and the command it launches both show up, so keep
              # one alert per computer per minute.
              max_count: 1
              period: 1m
              is_global: false
              keys:
                - agent-sensor-tamper
            metadata:
              title: Something tried to switch off or interfere with the security sensor
              what_it_means: >-
                A command was run that targets the LimaCharlie sensor on this
                computer (stopping it, uninstalling it, deleting its files,
                blocking its network access or similar). If the agent did this
                on its own, it may have been told to by something it read; if
                it is not something you asked for, treat it as a possible
                attack.
              what_to_do: >-
                Check that the sensor is still running and reporting. Look at
                the command shown in the alert details and ask the agent why it
                ran it. If you did not request it, stop the agent's current
                task and review what it recently read or was sent.
        tests:
          match:
            # Linux
            - - event:
                  COMMAND_LINE: pkill -9 rphcp
                  FILE_PATH: /usr/bin/pkill
                routing: &linux_process
                  event_type: NEW_PROCESS
                  hostname: dev-linux
                  plat: 536870912
            - - event:
                  COMMAND_LINE: sudo kill -9 $(pgrep -x rphcp)
                  FILE_PATH: /usr/bin/sudo
                routing: *linux_process
            - - event:
                  COMMAND_LINE: sudo systemctl stop limacharlie
                  FILE_PATH: /usr/bin/sudo
                routing: *linux_process
            - - event:
                  COMMAND_LINE: service limacharlie stop
                  FILE_PATH: /usr/sbin/service
                routing: *linux_process
            - - event:
                  COMMAND_LINE: systemctl disable --now limacharlie.service
                  FILE_PATH: /usr/bin/systemctl
                routing: *linux_process
            - - event:
                  COMMAND_LINE: bash -c "rm -rf /opt/limacharlie"
                  FILE_PATH: /usr/bin/bash
                routing: *linux_process
            - - event:
                  COMMAND_LINE: sudo apt remove limacharlie
                  FILE_PATH: /usr/bin/sudo
                routing: *linux_process
            - - event:
                  COMMAND_LINE: sudo rpm -e limacharlie
                  FILE_PATH: /usr/bin/sudo
                routing: *linux_process
            - - event:
                  COMMAND_LINE: rm /bin/rphcp /etc/hcp /etc/hcp_conf /etc/hcp_hbs
                  FILE_PATH: /usr/bin/rm
                routing: *linux_process
            - - event:
                  COMMAND_LINE: iptables -A OUTPUT -p tcp -d app.limacharlie.io -j DROP
                  FILE_PATH: /usr/sbin/iptables
                routing: *linux_process
            - - event:
                  COMMAND_LINE: bash -c "echo 127.0.0.1 api.limacharlie.io >> /etc/hosts"
                  FILE_PATH: /usr/bin/bash
                routing: *linux_process
            - - event:
                  COMMAND_LINE: chmod 000 /usr/local/bin/rphcp
                  FILE_PATH: /usr/bin/chmod
                routing: *linux_process
            - - event:
                  COMMAND_LINE: strace -p 1234 -o /tmp/out -e trace=network rphcp
                  FILE_PATH: /usr/bin/strace
                routing: *linux_process
            # macOS
            - - event:
                  COMMAND_LINE: sudo launchctl unload /Library/LaunchDaemons/com.refractionpoint.rphcp.plist
                  FILE_PATH: /usr/bin/sudo
                routing: &mac_process
                  event_type: NEW_PROCESS
                  hostname: dev-mac
                  plat: 805306368
            - - event:
                  COMMAND_LINE: launchctl bootout system /Library/LaunchDaemons/com.refractionpoint.rphcp.plist
                  FILE_PATH: /bin/launchctl
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo launchctl disable system/com.refractionpoint.rphcp
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo killall RPHCP
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo rm -rf /Applications/RPHCP.app
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo systemextensionsctl uninstall ABCDE12345 com.refractionpoint.rphcp.extension
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo rm -rf "/Library/Application Support/limacharlie"
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            - - event:
                  COMMAND_LINE: rm -rf /Library/Application\ Support/limacharlie
                  FILE_PATH: /bin/rm
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo /usr/local/bin/rphcp -c
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo pfctl -f /tmp/block-rphcp.conf
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            # Windows
            - - event:
                  COMMAND_LINE: taskkill /F /IM rphcp.exe
                  FILE_PATH: 'C:\Windows\System32\taskkill.exe'
                routing: &win_process
                  event_type: NEW_PROCESS
                  hostname: DEV-WIN
                  plat: 268435456
            - - event:
                  COMMAND_LINE: sc stop rphcpsvc
                  FILE_PATH: 'C:\Windows\System32\sc.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: '"C:\Windows\System32\sc.exe" delete rphcpsvc'
                  FILE_PATH: 'C:\Windows\System32\sc.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'sc config rphcpsvc start= disabled'
                  FILE_PATH: 'C:\Windows\System32\sc.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'net stop rphcpsvc'
                  FILE_PATH: 'C:\Windows\System32\net.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -Command "Stop-Service -Name rphcpsvc -Force"'
                  FILE_PATH: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'powershell.exe -Command "Get-Process rphcp | Stop-Process -Force"'
                  FILE_PATH: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'powershell -Command "Set-Service -Name rphcpsvc -StartupType Disabled"'
                  FILE_PATH: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: '"C:\Windows\System32\rphcp.exe" -c'
                  FILE_PATH: 'C:\Windows\System32\rphcp.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'powershell -Command "Remove-Item -Recurse -Force C:\ProgramData\limacharlie"'
                  FILE_PATH: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'cmd.exe /c del /f C:\Windows\System32\hcp_hbs'
                  FILE_PATH: 'C:\Windows\System32\cmd.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'netsh advfirewall firewall add rule name="Updater" dir=out action=block program="C:\Windows\System32\rphcp.exe"'
                  FILE_PATH: 'C:\Windows\System32\netsh.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'wmic process where name="rphcp.exe" delete'
                  FILE_PATH: 'C:\Windows\System32\wbem\WMIC.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'msiexec /x "C:\Downloads\hcp_win_x64.msi" /qn'
                  FILE_PATH: 'C:\Windows\System32\msiexec.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'powershell -Command "Add-Content C:\Windows\System32\drivers\etc\hosts ''127.0.0.1 app.limacharlie.io''"'
                  FILE_PATH: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                routing: *win_process
            # Keeping the installer's own commands quiet must not let these through: unloading, stopping or disabling the service, copying anything else over the sensor, removing its crash recovery, disabling it, or adding a firewall rule against it.
            - - event:
                  COMMAND_LINE: 'sudo systemctl disable limacharlie'
                  FILE_PATH: '/usr/bin/sudo'
                routing: *linux_process
            - - event:
                  COMMAND_LINE: '/usr/bin/systemctl mask limacharlie'
                  FILE_PATH: '/usr/bin/systemctl'
                routing: *linux_process
            - - event:
                  COMMAND_LINE: 'cp /tmp/evil /bin/rphcp'
                  FILE_PATH: '/usr/bin/cp'
                routing: *linux_process
            - - event:
                  COMMAND_LINE: 'bash -c "cp /opt/limacharlie/rphcp /bin/rphcp && rm -rf /opt/limacharlie"'
                  FILE_PATH: '/usr/bin/bash'
                routing: *linux_process
            - - event:
                  COMMAND_LINE: 'ufw deny out to any app.limacharlie.io'
                  FILE_PATH: '/usr/sbin/ufw'
                routing: *linux_process
            - - event:
                  COMMAND_LINE: 'ip6tables -A OUTPUT -d limacharlie.io -j DROP'
                  FILE_PATH: '/usr/sbin/ip6tables'
                routing: *linux_process
            - - event:
                  COMMAND_LINE: 'sudo /bin/launchctl unload /Library/LaunchDaemons/com.refractionpoint.rphcp.plist'
                  FILE_PATH: '/usr/bin/sudo'
                routing: *mac_process
            - - event:
                  COMMAND_LINE: 'sc.exe failure rphcpsvc reset= 0 actions= ""'
                  FILE_PATH: 'C:\Windows\System32\sc.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'sc.exe failure rphcpsvc reset= 2592000 actions= ""/0/""/0/""/0'
                  FILE_PATH: 'C:\Windows\System32\sc.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'sc failure rphcpsvc reset= 0 actions= restart/2000/run/0'
                  FILE_PATH: 'C:\Windows\System32\sc.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'cmd.exe /c sc.exe failure rphcpsvc reset= 2592000 actions= restart/2000/restart/2000/restart/2000 & sc.exe config rphcpsvc start= disabled'
                  FILE_PATH: 'C:\Windows\System32\cmd.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'sc.exe failureflag rphcpsvc 0'
                  FILE_PATH: 'C:\Windows\System32\sc.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'sc.exe config rphcpsvc start= disabled'
                  FILE_PATH: 'C:\Windows\System32\sc.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'netsh advfirewall firewall add rule name=Updater dir=out action=block remoteip=203.0.113.7 description=limacharlie.io'
                  FILE_PATH: 'C:\Windows\System32\netsh.exe'
                routing: *win_process
          non_match:
            # Everything the setup page tells the agent or the user to run, on
            # each operating system, including the shell wrappers agents put
            # around each command. Setting up LimaCharlie must never raise its
            # own alerts, so every rule that reads commands lists this too.
            # Update this list whenever the setup page changes. The test alert
            # (curl to a requestcatcher.com address) is meant to fire
            # agent-data-leak-site, which reads DNS lookups, not commands.
            - &setup_commands
              - event:
                  COMMAND_LINE: 'uname -s'
                  FILE_PATH: /usr/bin/uname
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'uname -m'
                  FILE_PATH: /usr/bin/uname
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'bash -c "uname -s && uname -m"'
                  FILE_PATH: /bin/bash
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'ls -la /.dockerenv /run/.containerenv'
                  FILE_PATH: /usr/bin/ls
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'bash -c "test -f /.dockerenv || test -f /run/.containerenv && echo container"'
                  FILE_PATH: /bin/bash
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'limacharlie --version'
                  FILE_PATH: /home/alex/.local/bin/limacharlie
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'limacharlie auth whoami --output yaml'
                  FILE_PATH: /home/alex/.local/bin/limacharlie
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'limacharlie sensor list --output yaml'
                  FILE_PATH: /home/alex/.local/bin/limacharlie
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'bash -c "limacharlie --version"'
                  FILE_PATH: /bin/bash
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'python3 -m pip install --user limacharlie'
                  FILE_PATH: /usr/bin/python3
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'pipx install limacharlie'
                  FILE_PATH: /home/alex/.local/bin/pipx
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'uv tool install limacharlie'
                  FILE_PATH: /home/alex/.local/bin/uv
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'pipx ensurepath'
                  FILE_PATH: /home/alex/.local/bin/pipx
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'mkdir -p -m 700 /home/alex/.limacharlie-setup'
                  FILE_PATH: /usr/bin/mkdir
                  USER_NAME: alex
                routing: *linux_process
              - event:
                  COMMAND_LINE: 'bash -c "mkdir -p -m 700 \"$HOME/.limacharlie-setup\""'
                  FILE_PATH: /bin/bash
                  USER_NAME: alex
                routing: *linux_process
