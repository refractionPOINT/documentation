      usr_mtd:
        enabled: true
        expiry: 0
        tags:
          - agent
        comment: Commands that stop, uninstall, delete, block or spy on the LimaCharlie sensor (Linux, macOS, Windows).

    # ------------------------------------------------------------------
    # 2. The computer's own protections being switched off
    # ------------------------------------------------------------------
    # Only the "turn it off" commands count. Asking what state a protection is
    # in (Get-MpPreference, spctl --status, ufw status, getenforce...) does not.
    agent-security-off:
      data:
        detect:
          event: NEW_PROCESS
          op: or
          rules:
            # Windows Defender: real-time protection and friends turned off,
            # or a folder / program / file type excluded from scanning.
            - op: matches
              path: event/COMMAND_LINE
              re: '(set|add)-mppreference\s[^|;]*-disable\w+[:\s]\s*\$?(true|1)($|[\s;)|"''])'
            - op: matches
              path: event/COMMAND_LINE
              re: '(set|add)-mppreference\s[^|;]*-exclusion(path|process|extension|ipaddress)'
            # Defender switched off through the registry.
            - op: and
              rules:
                - op: matches
                  path: event/COMMAND_LINE
                  re: 'windows defender|windowsdefender'
                - op: matches
                  path: event/COMMAND_LINE
                  re: 'disableantispyware|disableantivirus|disablerealtimemonitoring|disablebehaviormonitoring|disableioavprotection|disableonaccessprotection|tamperprotection'
                - op: matches
                  path: event/COMMAND_LINE
                  re: 'reg(\.exe)?"?\s+add|new-itemproperty|set-itemproperty'
                - op: matches
                  path: event/COMMAND_LINE
                  re: '(/d\s+(0x)?0*1|-value\s+1)($|[\s;)"''])'
            # Defender, the firewall, Security Center or the event log service
            # stopped, disabled or deleted.
            - op: and
              rules:
                - op: matches
                  path: event/COMMAND_LINE
                  re: '(^|[^A-Za-z0-9_.-])(sc|net|net1|stop-service|set-service)(\.exe)?"?\s+[^|;&]*(^|[\s"'',])(windefend|wdnissvc|mpssvc|securityhealthservice|wscsvc|wdfilter|wdboot|eventlog|sense)($|[\s"''])'
                - op: matches
                  path: event/COMMAND_LINE
                  re: '(^|[^A-Za-z0-9_.-])(stop|delete|disable|disabled)($|[^A-Za-z0-9_.-])'
            # Windows Firewall off.
            - op: matches
              path: event/COMMAND_LINE
              re: 'netsh(\.exe)?"?\s+advfirewall\s+set\s+(allprofiles|currentprofile|domainprofile|privateprofile|publicprofile)\s+state\s+off|netsh(\.exe)?"?\s+firewall\s+set\s+opmode\s+(mode=)?disable|set-netfirewallprofile\s[^|;]*-enabled[:\s]\s*(false|0|\$false)'
            # Windows event logs cleared or switched off, audit policy wiped.
            - op: matches
              path: event/COMMAND_LINE
              re: 'wevtutil(\.exe)?"?\s+(cl|clear-log)\s|(^|[^A-Za-z0-9_.-])(clear|remove)-eventlog|\bclearlog\(|wevtutil(\.exe)?"?\s+sl\s[^|;]*/e(nabled)?:false|auditpol(\.exe)?"?\s+/(clear|remove)|fsutil(\.exe)?"?\s+usn\s+deletejournal|(^|[^A-Za-z0-9_.-])(del|erase|remove-item|rm|rd)(\.exe)?\s+.*winevt[/\\]logs'
            # Windows: User Account Control off.
            - op: matches
              path: event/COMMAND_LINE
              re: 'enablelua\s.*(/d\s+(0x)?0+($|\s)|-value\s+0($|\s))'
            # macOS: Gatekeeper, System Integrity Protection, the application
            # firewall, the pf firewall, download quarantine; unified log wiped.
            - op: matches
              path: event/COMMAND_LINE
              re: 'spctl(\.exe)?\s+([^|;&]*\s)?--(master|global)-disable'
            - op: matches
              path: event/COMMAND_LINE
              re: '(^|[^A-Za-z0-9_.-])csrutil\s+(authenticated-root\s+)?disable($|\s)'
            - op: matches
              path: event/COMMAND_LINE
              re: 'socketfilterfw\s+([^|;&]*\s)?--setglobalstate\s+(off|0)($|\s)|defaults\s+write\s+\S*com\.apple\.alf\s+globalstate\s+(-int\s+)?0($|\s)|pfctl\s+([^|;&]*\s)?-d($|\s)|LSQuarantine\s+-bool\s+(no|false|0)($|\s)|(^|[^A-Za-z0-9_.-])log\s+erase\s'
            # Linux: firewall, SELinux, AppArmor and the audit daemon off.
            - op: matches
              path: event/COMMAND_LINE
              re: '(^|[^A-Za-z0-9_.-])ufw\s+([^|;&]*\s)?disable($|\s)|(^|[^A-Za-z0-9_.-])setenforce\s+(0|permissive)($|\s)|(^|[^A-Za-z0-9_.-])auditctl\s+(-e\s*0|-D)($|\s)|(^|[^A-Za-z0-9_.-])(aa-teardown|aa-disable)($|\s)'
            - op: matches
              path: event/COMMAND_LINE
              re: 'selinux=(disabled|permissive).*(/etc/selinux/config|/etc/sysconfig/selinux)|(/etc/selinux/config|/etc/sysconfig/selinux).*selinux=(disabled|permissive)'
            - op: matches
              path: event/COMMAND_LINE
              re: '(^|[^A-Za-z0-9_.-])systemctl\s+([^|;&]*\s)?(stop|disable|mask|kill)\s+([^|;&]*\s)?(auditd|firewalld|apparmor|ufw|fail2ban)(\.service)?($|[\s;|&])|(^|[^A-Za-z0-9_.-])service\s+(auditd|firewalld|apparmor|ufw|fail2ban)\s+stop($|\s)'
            # Linux: logs wiped.
            - op: matches
              path: event/COMMAND_LINE
              re: '(^|[^A-Za-z0-9_.-])(rm|shred|truncate|unlink)\s+[^|;&]*/var/log/(auth\.log|secure|syslog|messages|wtmp|btmp|lastlog|kern\.log|audit|journal)|(^|[^>])>\s*/var/log/(auth\.log|secure|syslog|messages|wtmp|btmp|lastlog|audit/audit\.log)|journalctl\s.*--vacuum-(time|size|files)[= ]\s*(0|1)[a-z]*($|\s)'
        respond:
          - action: report
            name: Security protections turned off
            priority: 5
            suppression:
              max_count: 1
              period: 1m
              is_global: false
              keys:
                - agent-security-off
            metadata:
              title: Something switched off a security protection on this computer
              what_it_means: >-
                A command turned off or weakened one of the computer's own
                defences: antivirus real-time protection or its exclusion
                list, the firewall, Gatekeeper or System Integrity Protection
                on a Mac, SELinux or the audit service on Linux, or it wiped
                the system logs. Attackers do this first so that whatever they
                run next is not stopped or recorded. Some setup scripts do it
                too, so check whether it matches something you asked for.
              what_to_do: >-
                Look at the command in the alert details and ask the agent why
                it ran it. If you did not ask for it, turn the protection back
                on right away, stop the agent's current task and review what it
                recently read or was sent.
        tests:
          match:
            # Windows
            - - event:
                  COMMAND_LINE: 'powershell.exe -NoProfile -Command "Set-MpPreference -DisableRealtimeMonitoring $true"'
                  FILE_PATH: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'powershell -Command "Set-MpPreference -DisableBehaviorMonitoring:$true -DisableIOAVProtection 1"'
                  FILE_PATH: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'powershell -Command "Add-MpPreference -ExclusionPath C:\Users\dev\Downloads"'
                  FILE_PATH: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'powershell -Command "Add-MpPreference -ExclusionProcess node.exe"'
                  FILE_PATH: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender" /v DisableAntiSpyware /t REG_DWORD /d 1 /f'
                  FILE_PATH: 'C:\Windows\System32\reg.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'sc stop WinDefend'
                  FILE_PATH: 'C:\Windows\System32\sc.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'sc config WinDefend start= disabled'
                  FILE_PATH: 'C:\Windows\System32\sc.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'net stop mpssvc'
                  FILE_PATH: 'C:\Windows\System32\net.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'netsh advfirewall set allprofiles state off'
                  FILE_PATH: 'C:\Windows\System32\netsh.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: '"C:\Windows\System32\netsh.exe" advfirewall set currentprofile state off'
                  FILE_PATH: 'C:\Windows\System32\netsh.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'powershell -Command "Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False"'
                  FILE_PATH: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'wevtutil cl Security'
                  FILE_PATH: 'C:\Windows\System32\wevtutil.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: '"C:\Windows\System32\wevtutil.exe" clear-log System'
                  FILE_PATH: 'C:\Windows\System32\wevtutil.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'powershell -Command "Clear-EventLog -LogName Application, System"'
                  FILE_PATH: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'auditpol /clear /y'
                  FILE_PATH: 'C:\Windows\System32\auditpol.exe'
                routing: *win_process
            - - event:
                  COMMAND_LINE: 'reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v EnableLUA /t REG_DWORD /d 0 /f'
                  FILE_PATH: 'C:\Windows\System32\reg.exe'
                routing: *win_process
            # macOS
            - - event:
                  COMMAND_LINE: sudo /usr/sbin/spctl --master-disable
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo spctl --global-disable
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            - - event:
                  COMMAND_LINE: csrutil disable
                  FILE_PATH: /usr/bin/csrutil
                routing: *mac_process
            - - event:
                  COMMAND_LINE: csrutil authenticated-root disable
                  FILE_PATH: /usr/bin/csrutil
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo defaults write /Library/Preferences/com.apple.alf globalstate -int 0
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo pfctl -d
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            - - event:
                  COMMAND_LINE: sudo log erase --all
                  FILE_PATH: /usr/bin/sudo
                routing: *mac_process
            # Linux
            - - event:
                  COMMAND_LINE: sudo ufw disable
                  FILE_PATH: /usr/bin/sudo
                routing: *linux_process
            - - event:
                  COMMAND_LINE: setenforce 0
                  FILE_PATH: /usr/sbin/setenforce
                routing: *linux_process
            - - event:
                  COMMAND_LINE: sed -i 's/SELINUX=enforcing/SELINUX=disabled/' /etc/selinux/config
                  FILE_PATH: /usr/bin/sed
                routing: *linux_process
            - - event:
                  COMMAND_LINE: systemctl stop auditd
                  FILE_PATH: /usr/bin/systemctl
                routing: *linux_process
            - - event:
                  COMMAND_LINE: sudo systemctl disable --now firewalld
                  FILE_PATH: /usr/bin/sudo
                routing: *linux_process
            - - event:
                  COMMAND_LINE: service auditd stop
                  FILE_PATH: /usr/sbin/service
                routing: *linux_process
            - - event:
                  COMMAND_LINE: auditctl -e 0
                  FILE_PATH: /usr/sbin/auditctl
                routing: *linux_process
            - - event:
                  COMMAND_LINE: rm -f /var/log/auth.log /var/log/wtmp
                  FILE_PATH: /usr/bin/rm
                routing: *linux_process
            - - event:
                  COMMAND_LINE: bash -c "> /var/log/syslog"
                  FILE_PATH: /usr/bin/bash
                routing: *linux_process
            - - event:
                  COMMAND_LINE: journalctl --rotate --vacuum-time=1s
                  FILE_PATH: /usr/bin/journalctl
                routing: *linux_process
          non_match:
            - *setup_commands
            # Asking about the state of a protection, or turning one ON.
            - - event:
                  COMMAND_LINE: 'powershell.exe -Command "Get-MpPreference"'
