                routing: *mac_process
              - event:
                  COMMAND_LINE: spctl --assess --verbose /Applications/Slack.app
                  FILE_PATH: /usr/sbin/spctl
                routing: *mac_process
              - event:
                  COMMAND_LINE: csrutil status
                  FILE_PATH: /usr/bin/csrutil
                routing: *mac_process
              - event:
                  COMMAND_LINE: /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
